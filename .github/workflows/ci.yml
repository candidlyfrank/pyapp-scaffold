name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: docker/setup-buildx-action@v3
      - run: uv python install 3.11
      - run: uv sync --locked --group dev
      - run: uv sync --locked --group dev --project src/django
      - run: uv sync --locked --group dev --project src/fastapi
      - run: make ci
