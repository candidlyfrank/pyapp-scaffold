[project]
name = "pyapp-fastapi"
version = "0.1.0"
description = "FastAPI service for the pyapp scaffold."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=5.0,<6.0",
    "python-json-logger>=2.0,<3.0",
    "asgi-correlation-id>=4.3,<5.0",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.7,<2.0",
    "debugpy>=1.8,<2.0",
    "factory-boy>=3.3,<4.0",
    "httpx>=0.27,<1.0",
    "pip-audit>=2.7,<3.0",
    "pytest>=9.0.3,<10.0",
    "pytest-watch>=4.2,<5.0",
    "pytest-xdist>=3.6,<4.0",
    "ruff>=0.9,<1.0",
    "testcontainers[redis]>=4.9,<5.0",
]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.bandit]
exclude_dirs = ["tests"]
