[project]
name = "pyapp-django"
version = "0.1.0"
description = "Django service for the pyapp scaffold."
requires-python = ">=3.11,<3.12"
dependencies = [
    "django>=5.0,<6.0",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=5.0,<6.0",
    "python-json-logger>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.7,<2.0",
    "debugpy>=1.8,<2.0",
    "django-debug-toolbar>=7.0.0",
    "factory-boy>=3.3,<4.0",
    "pip-audit>=2.7,<3.0",
    "pytest>=9.0.3,<10.0",
    "pytest-django>=4.8,<5.0",
    "pytest-watch>=4.2,<5.0",
    "pytest-xdist>=3.6,<4.0",
    "ruff>=0.9,<1.0",
    "testcontainers[postgres]>=4.9,<5.0",
]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "app.settings"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.bandit]
exclude_dirs = ["tests"]
