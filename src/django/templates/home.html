<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Django app is running</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #111827;
      }

      main {
        width: min(720px, calc(100vw - 48px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        margin: 0 0 16px;
        color: #4b5563;
        line-height: 1.6;
      }

      a {
        color: #0f766e;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Django app is running</h1>
      <p>Default Django scaffold with templates, middleware, static files, admin, auth, sessions, and messages enabled.</p>
      <p><a href="/admin/">Open Django admin</a> or check <a href="/health/">service health</a>.</p>
    </main>
  </body>
</html>
